# XcodeGen spec. Regenerate the project with:  xcodegen generate
name: ShotCaller
options:
  bundleIdPrefix: com.richardnelson
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ShotCallerCore:
    path: Packages/ShotCallerCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: M9JB3ZB9N8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  ShotCaller:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShotCaller
        excludes:
          - "Info.plist"
      - path: docs/PRIVACY.md
        buildPhase: resources
    dependencies:
      - package: ShotCallerCore
        product: ShotCallerCore
    # Wi-Fi Aware is a Debug-only internal test mode (docs/TRANSPORT.md, 2026-10-10): only Debug
    # builds carry its entitlement and the WiFiAwareServices declaration. Release ships neither.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richardnelson.opensourceselfiestick
        PRODUCT_NAME: ShotCaller
        INFOPLIST_FILE: ShotCaller/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ShotCaller-Release.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
        SUPPORTS_MACCATALYST: "NO"
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
          CODE_SIGN_ENTITLEMENTS: ShotCaller/ShotCaller.entitlements
        Release:
          INFOPLIST_FILE: ShotCaller/Info.plist
          CODE_SIGN_ENTITLEMENTS: Config/ShotCaller-Release.entitlements
    scheme:
      testTargets:
        - package: ShotCallerCore/ShotCallerCoreTests
