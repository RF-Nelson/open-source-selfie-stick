# XcodeGen spec. Regenerate the project with:  xcodegen generate
name: PairAndShoot
options:
  bundleIdPrefix: com.richardnelson
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PairAndShootCore:
    path: Packages/PairAndShootCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: M9JB3ZB9N8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PairAndShoot:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PairAndShoot
        excludes:
          - "Info.plist"
    dependencies:
      - package: PairAndShootCore
        product: PairAndShootCore
    entitlements:
      path: PairAndShoot/PairAndShoot.entitlements
      properties:
        com.apple.developer.wifi-aware:
          - Publish
          - Subscribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richardnelson.opensourceselfiestick
        PRODUCT_NAME: PairAndShoot
        INFOPLIST_FILE: PairAndShoot/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
        SUPPORTS_MACCATALYST: "NO"
    scheme:
      testTargets:
        - package: PairAndShootCore/PairAndShootCoreTests
